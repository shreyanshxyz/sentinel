services:
  - type: web
    name: sentinel-api
    env: node
    region: oregon
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: https://sentinel-one-beta.vercel.app
